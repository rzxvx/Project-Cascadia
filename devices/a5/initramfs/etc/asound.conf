# The speakers, card 0 on either iPad: the iPad mini 1's "iPadMini"
# (sound/soc/apple/s5l-audio.c, docs/research/p105-audio.md), the iPad 2's
# "iPad2" (sound/soc/apple/s5l8940-audio.c, docs/research/k93-audio.md).
# "default" mixes every client (dmix) into one 48 kHz 16-bit stream -- the
# rate the mini's amps' 12 MHz MCLK divides best, and one the iPad 2's I2S0
# runs -- and plug in front converts whatever a client opens; recording
# through "default" goes to "mic" (asym: dmix alone refuses capture).  hw:0,0
# is the card alone.  Comes with the image; /init copies it onto an NFS or
# NAND root at every boot.
pcm.!default {
	type asym
	playback.pcm "playback"
	capture.pcm "capture"
}
pcm.playback {
	type plug
	slave.pcm "speakers"
}
pcm.capture {
	type plug
	slave.pcm "mic"
}
pcm.speakers {
	type dmix
	ipc_key 5105
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
# The microphones (the iPad 2's: the built-in one, a headset's), shared the
# same way: dsnoop lets every client record at once.  The mini's card has no
# capture; there a recording fails as before.
pcm.mic {
	type dsnoop
	ipc_key 5106
	ipc_perm 0666
	slave {
		pcm "hw:0,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
ctl.!default {
	type hw
	card 0
}
