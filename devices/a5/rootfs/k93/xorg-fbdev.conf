# Guest RAM-only, explicit simplefb test. No GPU initialization. Touch is the
# Z2 panel on /dev/input/event0 when k93-z2-boot runs; without it the device
# fails to open and AllowMouseOpenFail keeps the server up.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Files"
    FontPath "/usr/share/fonts/misc"
EndSection
Section "Module"
    Disable "glx"
    Disable "glamoregl"
    Disable "dri"
    Disable "dri2"
EndSection
Section "Device"
    Identifier "K93Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection
Section "Screen"
    Identifier "K93Screen"
    Device "K93Framebuffer"
    DefaultDepth 24
EndSection
Section "InputDevice"
    Identifier "K93Touch"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    # the panel's long axis is Y, the framebuffer's is X (held-corner probe)
    Option "SwapAxes" "true"
EndSection
Section "ServerLayout"
    Identifier "K93Layout"
    Screen "K93Screen"
    InputDevice "K93Touch" "CorePointer"
EndSection
