Section "Device"
    Identifier "Cascadia simple framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "true"
EndSection

Section "InputClass"
    Identifier "Cascadia iPhone touchscreen"
    MatchProduct "Apple iPhone touchscreen"
    MatchIsTouchscreen "on"
    Driver "libinput"
    # Correct the ~60 px Y offset while keeping the bottom edge reachable
    # for GNOME's swipe-up on-screen keyboard gesture.
    Option "TransformationMatrix" "1 0 0 0 1.0375 -0.0375 0 0 1"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
