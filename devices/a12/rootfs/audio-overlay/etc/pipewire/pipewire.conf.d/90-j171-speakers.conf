context.objects = [
 { factory = adapter
   args = {
    factory.name = api.alsa.pcm.sink
    node.name = "j171-speakers"
    node.description = "iPad 8 Speaker Hardware"
    media.class = "Audio/Sink"
    api.alsa.path = "hw:CARD=Speakers,DEV=0"
    api.alsa.disable-mmap = true
    audio.format = "S16LE"
    audio.rate = 48000
    audio.allowed-rates = [ 48000 ]
    audio.channels = 4
    audio.position = [ FL FR RL RR ]
    node.pause-on-idle = true
    channelmix.disable = true
    channelmix.upmix = false
    priority.session = 100
    session.suspend-timeout-seconds = 3
    adapter.auto-port-config = { mode = dsp monitor = false position = preserve }
   }
 }
]
