# Native iOS slot map, acoustically verified: L,L,R,R. No software boost.
context.modules = [
 { name = libpipewire-module-filter-chain
   args = {
    node.description = "iPad 8 Speakers"
    filter.graph = {
     nodes = [
      { type = builtin name = left label = copy }
      { type = builtin name = right label = copy }
      { type = builtin name = left1 label = copy }
      { type = builtin name = left2 label = copy }
      { type = builtin name = right1 label = copy }
      { type = builtin name = right2 label = copy }
     ]
     links = [
      { output = "left:Out" input = "left1:In" }
      { output = "left:Out" input = "left2:In" }
      { output = "right:Out" input = "right1:In" }
      { output = "right:Out" input = "right2:In" }
     ]
     inputs = [ "left:In" "right:In" ]
     outputs = [ "left1:Out" "left2:Out" "right1:Out" "right2:Out" ]
    }
    audio.rate = 48000
    capture.props = {
     node.name = "ipad8-stereo"
     media.class = "Audio/Sink"
     audio.channels = 2
     audio.position = [ FL FR ]
     node.virtual = true
     priority.session = 1100
    }
    playback.props = {
     node.name = "ipad8-stereo-to-hardware"
     audio.channels = 4
     audio.position = [ FL FR RL RR ]
     target.object = "j171-speakers"
     node.dont-move = true
     stream.dont-remix = true
     channelmix.disable = true
     node.passive = true
    }
   }
 }
]
