# Guest RAM-only, explicit simplefb test. No input firmware or GPU initialization.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowMouseOpenFail" "true"
EndSection
Section "Files"
    FontPath "/usr/share/fonts/misc"
EndSection
Section "Module"
    Disable "glx"
    Disable "glamoregl"
    Disable "dri"
    Disable "dri2"
EndSection
Section "Device"
    Identifier "K93Framebuffer"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
    Option "ShadowFB" "false"
EndSection
Section "Screen"
    Identifier "K93Screen"
    Device "K93Framebuffer"
    DefaultDepth 24
EndSection
Section "ServerLayout"
    Identifier "K93Layout"
    Screen "K93Screen"
EndSection
