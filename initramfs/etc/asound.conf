# The iPad mini 1 speakers: card iPadMini (sound/soc/apple/s5l-audio.c,
# docs/research/p105-audio.md).  "default" mixes every client (dmix) into one
# 48 kHz stream, the rate the amps' 12 MHz MCLK divides best; plug in front
# converts whatever a client opens.  hw:iPadMini,0 is the card alone.
# Comes with the image; /init copies it onto an NFS root at every boot.
pcm.!default {
	type plug
	slave.pcm "speakers"
}
pcm.speakers {
	type dmix
	ipc_key 5105
	ipc_perm 0666
	slave {
		pcm "hw:iPadMini,0"
		rate 48000
		format S16_LE
		channels 2
		period_size 1024
		buffer_size 4096
	}
}
ctl.!default {
	type hw
	card iPadMini
}
