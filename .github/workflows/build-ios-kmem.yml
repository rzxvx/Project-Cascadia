name: Build A12 iOS GPU capture tools

on:
  workflow_dispatch:
  push:
    branches:
      - a12-xr
    paths:
      - .github/workflows/build-ios-kmem.yml
      - devices/a12/tools/ios/kmem.c
      - devices/a12/tools/ios/kmem.entitlements
      - devices/a12/tools/ios/g11cap.m
      - devices/a12/tools/ios/g11cap.entitlements

jobs:
  kmem:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Mach-O signer
        run: brew install ldid
      - name: Build and sign arm64 iOS kmem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p devices/a12/build/ios
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 -isysroot "$sdk" \
            -Os -Wall -Wextra -Wno-unused-parameter \
            -framework CoreFoundation -framework IOKit \
            devices/a12/tools/ios/kmem.c \
            -o devices/a12/build/ios/kmem
          ldid -Sdevices/a12/tools/ios/kmem.entitlements devices/a12/build/ios/kmem
          file devices/a12/build/ios/kmem
          ldid -e devices/a12/build/ios/kmem
      - name: Build and sign arm64 iOS G11 offscreen capture
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=17.0 -isysroot "$sdk" \
            -Os -Wall -Wextra -Werror -fobjc-arc \
            -framework Foundation -framework Metal \
            devices/a12/tools/ios/g11cap.m \
            -o devices/a12/build/ios/g11cap
          ldid -Sdevices/a12/tools/ios/g11cap.entitlements devices/a12/build/ios/g11cap
          file devices/a12/build/ios/g11cap
          ldid -e devices/a12/build/ios/g11cap
      - name: Upload A12 iOS tools
        uses: actions/upload-artifact@v4
        with:
          name: ios-a12-gpu-capture-arm64
          path: |
            devices/a12/build/ios/kmem
            devices/a12/build/ios/g11cap
          if-no-files-found: error
